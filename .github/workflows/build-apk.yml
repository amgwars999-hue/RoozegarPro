name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Setup JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      
    - name: Install dependencies
      run: npm install
      
    - name: Expo Prebuild (Android)
      run: npx expo prebuild -p android --clean
      
    - name: Make gradlew executable
      run: chmod +x android/gradlew
      
    - name: Build Release APK
      run: |
        cd android
        ./gradlew assembleRelease --no-daemon
      
    - name: Find APK files
      run: |
        echo "=== Looking for APK files ==="
        find android -name "*.apk" -type f
        echo "=== APK directories ==="
        ls -la android/app/build/outputs/apk/ 2>/dev/null || true
        ls -la android/app/build/outputs/apk/release/ 2>/dev/null || true
        ls -la android/app/build/outputs/apk/debug/ 2>/dev/null || true
        
    - name: Upload Release APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: roozegar-pro-apk
        path: android/app/build/outputs/apk/release/*.apk
        
    - name: Upload Debug APK (fallback)
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: roozegar-pro-debug-apk
        path: android/app/build/outputs/apk/debug/*.apk
